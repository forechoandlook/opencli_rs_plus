site: opengameart
name: search
description: 搜索 OpenGameArt 游戏素材
domain: opengameart.org
strategy: public
browser: true
timeoutSeconds: 45

args:
  query:
    type: str
    required: true
    positional: true
    description: "Asset keywords"
  limit:
    type: int
    default: 20
    description: "Maximum number of results"

pipeline:
  - navigate:
      url: "https://opengameart.org/art-search?keys=${{ args.query | urlencode }}"
      retry: false

  - wait: 2

  - evaluate: |
      (() => {
        const limit = ${{ args.limit | json }};
        const items = [];
        for (const link of document.querySelectorAll('a[href]')) {
          const url = link.href;
          const title = link.textContent.trim().replace(/\s+/g, ' ');
          if (!url.includes('/content/') || !title || /\/content\/faq\/?$/.test(url)) continue;
          if (items.some(item => item.url === url)) continue;
          items.push({
            rank: items.length + 1,
            title,
            url,
            license: 'review on asset detail page before use',
            commercial_safe: false,
          });
          if (items.length >= limit) break;
        }
        if (!items.length) throw new Error('OpenGameArt returned no asset links');
        return items;
      })()

  - limit: ${{ args.limit }}

columns: [rank, title, license, commercial_safe, url]
