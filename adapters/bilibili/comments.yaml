site: bilibili
name: comments
description: "读取指定 B 站视频首屏顶层评论（只读，不点赞、回复或翻页）"
domain: www.bilibili.com
strategy: cookie
browser: true
timeoutSeconds: 60

args:
  bvid:
    positional: true
    type: string
    required: true
    description: "视频 BV 号，例如 BV1xxx"
  limit:
    type: int
    default: 20
    description: "首屏顶层评论数，最大 50；不自动翻页"
  order:
    type: string
    default: hot
    choices: [hot, time]
    description: "hot=热门，time=最新"

columns: [rank, comment_id, author, content, likes, replies, time]

pipeline:
  - navigate:
      url: https://www.bilibili.com/video/${{ args.bvid }}/
      retry: false
  - evaluate:
      retry: false
      js: |
        (async () => {
          const bvid = String(args.bvid || '').trim();
          const limit = Math.min(Math.max(Number(args.limit) || 20, 1), 50);
          if (!/^BV[0-9A-Za-z]+$/.test(bvid)) throw new Error('bvid 格式应为 BV 开头的视频号');
          const state = window.__INITIAL_STATE__ || {};
          const aid = state.aid || state.videoData?.aid;
          if (!aid) throw new Error('未从视频页面提取 aid；页面可能未加载完成或视频不可用');
          const mode = args.order === 'time' ? 2 : 3;
          const query = new URLSearchParams({ type: '1', oid: String(aid), mode: String(mode), next: '0', ps: String(limit) });
          const response = await fetch('https://api.bilibili.com/x/v2/reply/main?' + query, { credentials: 'include' });
          const payload = await response.json();
          if (payload?.code !== 0) {
            throw new Error(`评论接口失败: ${payload?.message || 'unknown'} (${payload?.code ?? 'no code'})`);
          }
          const clean = value => String(value || '').replace(/\s+/g, ' ').trim();
          return (payload?.data?.replies || []).slice(0, limit).map((reply, index) => ({
            rank: index + 1,
            comment_id: String(reply.rpid || ''),
            author: clean(reply.member?.uname),
            content: clean(reply.content?.message),
            likes: Number(reply.like || 0),
            replies: Number(reply.rcount || 0),
            time: reply.ctime ? new Date(Number(reply.ctime) * 1000).toISOString() : '',
          }));
        })()
  - map:
      rank: '${{ item.rank }}'
      comment_id: '${{ item.comment_id }}'
      author: '${{ item.author }}'
      content: '${{ item.content }}'
      likes: '${{ item.likes }}'
      replies: '${{ item.replies }}'
      time: '${{ item.time }}'
