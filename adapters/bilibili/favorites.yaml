site: bilibili
name: favorites
description: "我的 B 站收藏夹列表（只读）"
domain: www.bilibili.com
strategy: cookie
browser: true

columns: [id, title, count, visibility]

pipeline:
  # Seed + opencli KV: bilibili:me.mid
  - evaluate:
      retry: false
      js: |
        (() => ({ mid: '', source: '' }))()
  - kv_get:
      key: bilibili:me.mid
      field: mid
      only_if_empty: true
  - navigate: https://www.bilibili.com
  - evaluate:
      retry: false
      js: |
        (async () => {
          let mid = String(data.mid || '').trim();
          let source = String(data.source || '');
          if (!/^\d+$/.test(mid)) {
            const navRes = await fetch('https://api.bilibili.com/x/web-interface/nav', { credentials: 'include' });
            const nav = await navRes.json();
            mid = String(nav?.data?.mid || '').trim();
            source = 'nav';
            if (!/^\d+$/.test(mid)) throw new Error('AUTH_REQUIRED: bilibili.com');
          } else if (!source) {
            source = 'kv';
          }

          const res = await fetch(
            'https://api.bilibili.com/x/v3/fav/folder/created/list-all?up_mid=' + encodeURIComponent(mid),
            { credentials: 'include' }
          );
          const payload = await res.json();
          if (payload?.code !== 0) {
            // Stale mid (account switch) — re-resolve once from nav
            if (/^\d+$/.test(String(data.mid || '')) && source === 'kv') {
              const navRes = await fetch('https://api.bilibili.com/x/web-interface/nav', { credentials: 'include' });
              const nav = await navRes.json();
              const fresh = String(nav?.data?.mid || '').trim();
              if (/^\d+$/.test(fresh) && fresh !== mid) {
                mid = fresh;
                source = 'nav';
                const retry = await fetch(
                  'https://api.bilibili.com/x/v3/fav/folder/created/list-all?up_mid=' + encodeURIComponent(mid),
                  { credentials: 'include' }
                );
                const payload2 = await retry.json();
                if (payload2?.code !== 0) {
                  throw new Error('获取收藏夹列表失败: ' + (payload2?.message || payload2?.code || 'unknown error'));
                }
                return {
                  mid,
                  source,
                  rows: (payload2?.data?.list || []).map((folder) => ({
                    id: String(folder.id || ''),
                    title: String(folder.title || ''),
                    count: Number(folder.media_count || 0),
                    visibility: Number(folder.attr || 0) === 0 ? 'public' : 'private',
                  })),
                };
              }
            }
            throw new Error('获取收藏夹列表失败: ' + (payload?.message || payload?.code || 'unknown error'));
          }
          return {
            mid,
            source,
            rows: (payload?.data?.list || []).map((folder) => ({
              id: String(folder.id || ''),
              title: String(folder.title || ''),
              count: Number(folder.media_count || 0),
              visibility: Number(folder.attr || 0) === 0 ? 'public' : 'private',
            })),
          };
        })()
  - kv_set:
      key: bilibili:me.mid
      value: ${{ data.mid }}
  - select: rows
