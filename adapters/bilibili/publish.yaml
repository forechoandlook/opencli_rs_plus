site: bilibili
name: publish
description: "上传并投稿 B 站视频；默认只准备表单，需 --confirm true --submit true 才会点击立即投稿"
domain: member.bilibili.com
strategy: cookie
browser: true
timeoutSeconds: 180

args:
  video:
    positional: true
    type: string
    required: true
    description: "待投稿视频的绝对路径"
  title:
    type: string
    required: true
    description: "视频标题（最多 80 字）"
  description:
    type: string
    default: ""
    description: "可选视频简介"
  settle_seconds:
    type: int
    default: 10
    description: "上传后等待表单出现的秒数"
  confirm:
    type: bool
    required: true
    description: "必须显式传 --confirm true 才会上传文件和填写页面"
  submit:
    type: bool
    default: false
    description: "默认 false；仅 --submit true 才会点击立即投稿"

columns: [status, detail, page_url]

pipeline:
  - navigate:
      url: https://member.bilibili.com/platform/upload/video/frame
      retry: false
  - wait:
      selector: 'input[type="file"][accept*=".mp4"]:not([name])'
  - evaluate:
      retry: false
      js: |
        (() => {
          if (args.confirm !== true) {
            throw new Error('上传或投稿需要显式传 --confirm true；当前没有修改页面或上传文件');
          }
          const title = String(args.title || '').trim();
          const video = String(args.video || '').trim();
          if (!video) throw new Error('video 不能为空');
          if (!title) throw new Error('title 不能为空');
          if (title.length > 80) throw new Error(`title 长度为 ${title.length}，不能超过 80`);
          if (!document.querySelector('input[type="file"][accept*=".mp4"]:not([name])')) {
            throw new Error('未找到 B 站主视频上传控件；页面可能已改版或登录已过期');
          }
          return { validated: true, submit: args.submit === true };
        })()
  - upload:
      selector: 'input[type="file"][accept*=".mp4"]:not([name])'
      paths: '${{ args.video }}'
      retry: false
  - wait:
      time: '${{ args.settle_seconds }}'
  - evaluate:
      retry: false
      js: |
        (() => {
          const setInputValue = (input, value) => {
            const setter = Object.getOwnPropertyDescriptor(HTMLInputElement.prototype, 'value')?.set;
            if (!setter) throw new Error('浏览器不支持标题输入');
            setter.call(input, value);
            input.dispatchEvent(new InputEvent('input', { bubbles: true, inputType: 'insertText', data: value }));
            input.dispatchEvent(new Event('change', { bubbles: true }));
          };
          const title = String(args.title || '').trim();
          const description = String(args.description || '').trim();
          const titleInput = [...document.querySelectorAll('input')].find(input =>
            input.offsetParent !== null && input.type !== 'file' && (input.maxLength === 80 || input.placeholder?.includes('标题'))
          );
          if (!(titleInput instanceof HTMLInputElement)) {
            throw new Error('视频上传后未找到 B 站标题输入框；请增大 --settle_seconds 后重试，未投稿');
          }
          setInputValue(titleInput, title);
          if (description) {
            const editor = [...document.querySelectorAll('textarea, [contenteditable="true"]')].find(item => item.offsetParent !== null);
            if (!(editor instanceof HTMLElement)) throw new Error('视频上传后未找到 B 站简介编辑器；未投稿');
            if (editor instanceof HTMLTextAreaElement) {
              const setter = Object.getOwnPropertyDescriptor(HTMLTextAreaElement.prototype, 'value')?.set;
              if (!setter) throw new Error('浏览器不支持简介输入');
              setter.call(editor, description);
            } else {
              editor.textContent = description;
            }
            editor.dispatchEvent(new InputEvent('input', { bubbles: true, inputType: 'insertText', data: description }));
            editor.dispatchEvent(new Event('change', { bubbles: true }));
          }
          return { ready: true, submit: args.submit === true };
        })()
  - evaluate:
      retry: false
      js: |
        (async () => {
          if (args.submit !== true) {
            return [{
              status: '已上传并填写，未投稿',
              detail: '默认 --submit false；请在页面补全分区等必填项，并显式传 --submit true 后才会点击立即投稿',
              page_url: location.href,
            }];
          }
          const button = [...document.querySelectorAll('button, [role="button"]')].find(item => {
            const label = (item.textContent || '').replace(/\s+/g, '').trim();
            return item.offsetParent !== null && !item.hasAttribute('disabled') && (label === '立即投稿' || label.includes('立即投稿'));
          });
          if (!(button instanceof HTMLElement)) throw new Error('未找到可用的“立即投稿”按钮；请先补全分区、标签和版权声明，未投稿');
          const before = location.href;
          button.click();
          await new Promise(resolve => setTimeout(resolve, 2500));
          const errors = [...document.querySelectorAll('[class*="error"], [class*="Error"]')]
            .filter(item => item.offsetParent !== null)
            .map(item => (item.textContent || '').replace(/\s+/g, ' ').trim())
            .filter(Boolean)
            .slice(0, 3);
          return [{
            status: errors.length ? '未投稿：请补全 B 站表单' : '已点击立即投稿，请在创作中心确认',
            detail: errors.length ? errors.join('；') : '平台可能仍在处理上传、跳转或审核',
            page_url: location.href || before,
          }];
        })()
  - map:
      status: '${{ item.status }}'
      detail: '${{ item.detail }}'
      page_url: '${{ item.page_url }}'
