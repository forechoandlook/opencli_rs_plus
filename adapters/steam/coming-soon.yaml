site: steam
name: coming-soon
description: Steam 即将发售游戏
domain: store.steampowered.com
strategy: public
browser: false

args:
  limit:
    type: int
    default: 20
    description: "Number of games"

pipeline:
  - fetch:
      url: https://store.steampowered.com/api/featuredcategories/

  - select: coming_soon.items

  - map:
      rank: ${{ index + 1 }}
      id: ${{ item.id }}
      name: ${{ item.name }}
      price: ${{ item.final_price || 0 }}
      original_price: ${{ item.original_price || item.final_price || 0 }}
      discount: ${{ item.discount_percent || 0 }}
      url: https://store.steampowered.com/app/${{ item.id }}

  - limit: ${{ args.limit }}

columns: [rank, id, name, price, original_price, discount, url]
