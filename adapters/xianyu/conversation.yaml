site: xianyu
name: conversation
description: 读取闲鱼聊天页当前打开会话的已加载消息（只读，不发送消息）
domain: www.goofish.com
strategy: cookie
browser: true

args:
  limit:
    type: int
    default: 50
    description: Number of currently loaded messages to return

columns: [conversation, from, text]

pipeline:
  - navigate: https://www.goofish.com/im
  - evaluate: |
      (async () => {
        const limit = Number(${{ args.limit | default(50) | json }}) || 50;
        const wait = ms => new Promise(resolve => setTimeout(resolve, ms));
        for (let attempt = 0; attempt < 32; attempt++) {
          if (document.querySelector('[class*="message-row"]')) break;
          await wait(250);
        }
        const clean = value => String(value || '').replace(/\s+/g, ' ').trim();
        const conversation = clean(document.querySelector('[class*="message-topbar"]')?.textContent || '');
        return Array.from(document.querySelectorAll('[class*="message-row"]')).slice(0, limit).map(row => {
          const content = row.querySelector('[class*="message-content"]');
          const isOther = !!row.querySelector('[class*="message-text-left"], [class*="msg-text-left"]');
          const isMe = !!row.querySelector('[class*="message-text-right"], [class*="msg-text-right"]');
          return {
            conversation,
            from: isOther ? 'other' : (isMe ? 'me' : 'system'),
            text: clean(content?.innerText || row.innerText || ''),
          };
        }).filter(item => item.text);
      })()
  - limit: ${{ args.limit | default(50) }}
