site: xianyu
name: messages
description: 通过闲鱼已验证会话 API 读取会话、最新摘要和未读数（只读，不发送消息）
domain: www.goofish.com
strategy: cookie
browser: true

args:
  limit:
    type: int
    default: 20
    description: Number of loaded conversations to return

columns: [rank, session_id, session_type, sender, preview, time, unread]

pipeline:
  - navigate: https://www.goofish.com/im
  - evaluate: |
      (async () => {
        const limit = Number(${{ args.limit | default(20) | json }}) || 20;
        const wait = ms => new Promise(resolve => setTimeout(resolve, ms));
        for (let attempt = 0; attempt < 32; attempt++) {
          if (window.lib?.mtop?.request) break;
          await wait(250);
        }
        if (!window.lib?.mtop?.request) throw new Error('闲鱼消息 API 尚未就绪，请检查登录状态或稍后重试');
        const clean = value => String(value || '').replace(/\s+/g, ' ').trim();
        const response = await window.lib.mtop.request({
          api: 'mtop.taobao.idlemessage.pc.session.sync',
          data: { sessionTypes: '[3]', fetchNum: limit },
          type: 'POST',
          v: '3.0',
          dataType: 'json',
          appKey: '34839810',
          needLogin: true,
          needLoginPC: true,
          sessionOption: 'AutoLoginOnly',
          ecode: 0,
        });
        const sessions = response?.data?.sessions;
        if (!Array.isArray(sessions)) throw new Error('闲鱼消息 API 未返回会话列表');
        return sessions.slice(0, limit).map(entry => {
          const session = entry?.session || {};
          const user = session.userInfo || {};
          const summary = entry?.message?.summary || {};
          const timestamp = Number(summary.ts || 0);
          return {
            session_id: String(session.sessionId || ''),
            session_type: Number(session.sessionType || 0),
            sender: clean(user.fishNick || user.nick || ''),
            preview: clean(summary.summary || ''),
            time: Number.isFinite(timestamp) && timestamp > 0 ? new Date(timestamp).toISOString() : '',
            unread: Number(summary.unread || 0),
          };
        }).filter(item => item.session_id && item.sender);
      })()
  - map:
      rank: ${{ index + 1 }}
      session_id: ${{ item.session_id }}
      session_type: ${{ item.session_type }}
      sender: ${{ item.sender }}
      preview: ${{ item.preview }}
      time: ${{ item.time }}
      unread: ${{ item.unread }}
  - limit: ${{ args.limit | default(20) }}
