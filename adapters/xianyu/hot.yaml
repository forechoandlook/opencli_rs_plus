site: xianyu
name: hot
description: 读取闲鱼首页当前展示的热门搜索词（只读）
domain: www.goofish.com
strategy: cookie
browser: true

args:
  limit:
    type: int
    default: 10
    description: Number of visible search recommendations to return

columns: [rank, keyword, url]

pipeline:
  - navigate: https://www.goofish.com/
  - evaluate: |
      (async () => {
        const limit = Number(${{ args.limit | default(10) | json }}) || 10;
        const wait = ms => new Promise(resolve => setTimeout(resolve, ms));
        for (let attempt = 0; attempt < 32; attempt++) {
          if (document.querySelector('a[class*="search-item"][href*="/search?q="]')) break;
          await wait(250);
        }
        const clean = value => String(value || '').replace(/\s+/g, ' ').trim();
        return Array.from(document.querySelectorAll('a[class*="search-item"][href*="/search?q="]'))
          .slice(0, limit)
          .map(link => ({ keyword: clean(link.textContent || ''), url: link.href || '' }))
          .filter(item => item.keyword && item.url);
      })()
  - map:
      rank: ${{ index + 1 }}
      keyword: ${{ item.keyword }}
      url: ${{ item.url }}
  - limit: ${{ args.limit | default(10) }}
