site: xianyu
name: unread
description: 通过闲鱼已验证红点 API 读取消息总未读数（只读）
domain: www.goofish.com
strategy: cookie
browser: true

columns: [total]

pipeline:
  - navigate: https://www.goofish.com/im
  - evaluate: |
      (async () => {
        const wait = ms => new Promise(resolve => setTimeout(resolve, ms));
        for (let attempt = 0; attempt < 32; attempt++) {
          if (window.lib?.mtop?.request) break;
          await wait(250);
        }
        if (!window.lib?.mtop?.request) throw new Error('闲鱼消息 API 尚未就绪，请检查登录状态或稍后重试');
        const response = await window.lib.mtop.request({
          api: 'mtop.taobao.idlemessage.pc.redpoint.query',
          data: { sessionTypes: '1,19,15,32,3,44,51,52,24', fetch: 50 },
          type: 'POST',
          v: '1.0',
          dataType: 'json',
          appKey: '34839810',
          needLogin: true,
          needLoginPC: true,
          sessionOption: 'AutoLoginOnly',
          ecode: 0,
        });
        const total = Number(response?.data?.total);
        if (!Number.isFinite(total)) throw new Error('闲鱼红点 API 未返回未读数');
        return [{ total }];
      })()
