site: xianyu
name: download
description: 下载闲鱼商品详情页已经展示的公开图片，并保存商品元数据
domain: www.goofish.com
strategy: cookie
browser: true
timeoutSeconds: 90

args:
  item_id:
    type: str
    required: true
    positional: true
    description: 闲鱼商品 item_id
  output:
    type: str
    default: "./xianyu-downloads"
    description: Output directory
  limit:
    type: int
    default: 20
    description: Maximum number of public item images to download

columns: [index, type, status, size]

pipeline:
  - navigate: https://www.goofish.com/item?id=${{ args.item_id }}
  - evaluate: |
      (async () => {
        const itemId = String(${{ args.item_id | json }} || '').trim();
        const output = ${{ args.output | default('./xianyu-downloads') | json }};
        const limit = Number(${{ args.limit | default(20) | json }}) || 20;
        if (!/^\d+$/.test(itemId)) throw new Error('item_id must be numeric');
        const wait = ms => new Promise(resolve => setTimeout(resolve, ms));
        for (let attempt = 0; attempt < 32 && !window.lib?.mtop?.request; attempt++) await wait(250);
        if (!window.lib?.mtop?.request) throw new Error('闲鱼详情页尚未就绪，请检查登录状态或稍后重试');
        const response = await window.lib.mtop.request({
          api: 'mtop.taobao.idle.pc.detail',
          data: { itemId },
          type: 'POST',
          v: '1.0',
          dataType: 'json',
          needLogin: false,
          needLoginPC: false,
          sessionOption: 'AutoLoginOnly',
          ecode: 0,
        });
        const item = response?.data?.itemDO || {};
        const seller = response?.data?.sellerDO || {};
        const clean = value => String(value ?? '').replace(/\s+/g, ' ').trim();
        const seen = new Set();
        const items = [];
        for (const image of Array.isArray(item.imageInfos) ? item.imageInfos : []) {
          const url = clean(image?.url || image?.urlDefault || image?.photoSearchUrl || '');
          if (!/^https?:\/\//i.test(url) || !/^(?:https?:\/\/)?img\.alicdn\.com\//i.test(url) || seen.has(url)) continue;
          seen.add(url);
          items.push({ type: 'image', url, width: Number(image?.widthSize || 0), height: Number(image?.heightSize || 0) });
          if (items.length >= limit) break;
        }
        if (!items.length) throw new Error('商品详情未提供可下载的公开图片');
        return {
          itemId: clean(item.itemId || itemId),
          title: clean(item.title || ''),
          author: clean(seller.nick || seller.uniqueName || ''),
          content: clean(item.desc || item.description || ''),
          price: item.soldPrice ? `¥${item.soldPrice}` : (item.defaultPrice ? `¥${item.defaultPrice}` : ''),
          location: clean(seller.publishCity || seller.city || ''),
          sourceUrl: location.href,
          items,
          output,
          username: `item-${itemId}`,
        };
      })()
  - download:
      type: media-batch
      output: "${{ data.output }}"
      username: "${{ data.username }}"
      referer: "https://www.goofish.com/"
      saveMetadata: true
      metadataFilename: item.md
