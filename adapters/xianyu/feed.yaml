site: xianyu
name: feed
description: 读取闲鱼首页已经展示的猜你喜欢商品（只读）
domain: www.goofish.com
strategy: cookie
browser: true

args:
  limit:
    type: int
    default: 20
    description: Number of homepage recommendations to return

columns: [rank, item_id, title, price, location, url]

pipeline:
  - navigate: https://www.goofish.com/
  - evaluate: |
      (async () => {
        const limit = Number(${{ args.limit | default(20) | json }}) || 20;
        const wait = ms => new Promise(resolve => setTimeout(resolve, ms));
        for (let attempt = 0; attempt < 32; attempt++) {
          if (document.querySelector('[class*="feeds-item-wrap"][href*="/item?"]')) break;
          await wait(250);
        }
        const clean = value => String(value || '').replace(/\s+/g, ' ').trim();
        const cards = Array.from(document.querySelectorAll('[class*="feeds-item-wrap"][href*="/item?"]'));
        return cards.slice(0, limit).map(card => {
          const href = card.href || card.getAttribute('href') || '';
          const priceWrap = card.querySelector('[class*="price-wrap"]');
          const number = clean(priceWrap?.querySelector('[class*="number"]')?.textContent || '');
          const decimal = clean(priceWrap?.querySelector('[class*="decimal"]')?.textContent || '');
          return {
            item_id: (href.match(/[?&]id=(\d+)/) || [])[1] || '',
            title: clean(card.querySelector('[class*="row1-wrap-title"], [class*="main-title"]')?.textContent || ''),
            price: number ? `¥${number}${decimal}` : '',
            location: clean(card.querySelector('[class*="row4-wrap-seller"] [class*="seller-text"]')?.textContent || ''),
            url: href,
          };
        }).filter(item => item.item_id && item.title);
      })()
  - map:
      rank: ${{ index + 1 }}
      item_id: ${{ item.item_id }}
      title: ${{ item.title }}
      price: ${{ item.price }}
      location: ${{ item.location }}
      url: ${{ item.url }}
  - limit: ${{ args.limit | default(20) }}
