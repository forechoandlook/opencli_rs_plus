site: kenney
name: category
description: 浏览 Kenney CC0 游戏素材分类
domain: kenney.nl
strategy: public
browser: true
timeoutSeconds: 45

args:
  category:
    type: str
    required: true
    positional: true
    description: "Category: 2D, 3D, Audio, or Textures"
  limit:
    type: int
    default: 20
    description: "Maximum number of asset packs"

pipeline:
  - navigate:
      url: "https://kenney.nl/assets/category:${{ args.category | urlencode }}"
      retry: false

  - wait: 2

  - evaluate: |
      (() => {
        const category = ${{ args.category | json }};
        const limit = ${{ args.limit | json }};
        const allowed = ['2D', '3D', 'Audio', 'Textures'];
        if (!allowed.includes(category)) throw new Error(`category must be one of: ${allowed.join(', ')}`);
        const items = Array.from(document.querySelectorAll('.asset'))
          .map(card => {
            const titleLink = card.querySelector('h2 a[href]');
            const cover = card.querySelector('.cover');
            return titleLink ? {
              title: titleLink.textContent.trim(),
              category: card.querySelector('.text-muted')?.textContent.trim().replace(/\s+/g, ' ') || category,
              license: 'CC0',
              commercial_safe: true,
              thumbnail: cover?.style.backgroundImage.match(/url\(["']?(.*?)["']?\)/)?.[1] || '',
              url: titleLink.href,
            } : null;
          })
          .filter(Boolean)
          .slice(0, limit)
          .map((item, index) => ({ rank: index + 1, ...item }));
        if (!items.length) throw new Error(`Kenney returned no ${category} asset packs`);
        return items;
      })()

  - limit: ${{ args.limit }}

columns: [rank, title, category, license, commercial_safe, url]
