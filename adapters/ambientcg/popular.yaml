site: ambientcg
name: popular
description: 获取 ambientCG 热门 PBR 材质
domain: ambientcg.com
strategy: public
browser: true
timeoutSeconds: 45

args:
  limit:
    type: int
    default: 20
    description: "Maximum number of materials"

pipeline:
  - navigate:
      url: https://ambientcg.com/list?type=material&sort=popular
      retry: false

  - wait: 3

  - evaluate: |
      (() => {
        const limit = ${{ args.limit | json }};
        const items = [];
        for (const image of document.querySelectorAll('img[alt^="Asset: "]')) {
          const id = image.alt.replace(/^Asset:\s*/, '').trim();
          if (!id || items.some(item => item.id === id)) continue;
          const link = image.closest('a[href]');
          items.push({
            rank: items.length + 1,
            id,
            name: id,
            type: 'material',
            license: 'CC0',
            commercial_safe: true,
            thumbnail: image.currentSrc || image.src,
            url: link?.href || `https://ambientcg.com/view?id=${encodeURIComponent(id)}`,
          });
          if (items.length >= limit) break;
        }
        if (!items.length) throw new Error('ambientCG did not render material cards');
        return items;
      })()

  - limit: ${{ args.limit }}

columns: [rank, id, name, type, license, commercial_safe, url]
