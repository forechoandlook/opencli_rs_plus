site: itchio
name: assets
description: 浏览 itch.io 热门独立游戏素材包
domain: itch.io
strategy: public
browser: true
timeoutSeconds: 45

args:
  limit:
    type: int
    default: 20
    description: "Maximum number of asset packs"

pipeline:
  - navigate:
      url: https://itch.io/game-assets
      retry: false

  - wait: 2

  - evaluate: |
      (() => {
        const limit = ${{ args.limit | json }};
        const items = [];
        for (const link of document.querySelectorAll('a.title.game_link[href]')) {
          const card = link.closest('.game_cell, .cell') || link.parentElement?.parentElement;
          const title = link.textContent.trim().replace(/\s+/g, ' ');
          if (!title || items.some(item => item.url === link.href)) continue;
          const text = card?.textContent?.trim().replace(/\s+/g, ' ') || '';
          const price = card?.querySelector('.price_value, .price')?.textContent?.trim() || '';
          const author = card?.querySelector('.user_link, .game_author a')?.textContent?.trim() || '';
          items.push({
            rank: items.length + 1,
            title,
            author,
            price,
            license: 'review product page before use',
            commercial_safe: false,
            summary: text.slice(0, 240),
            url: link.href,
          });
          if (items.length >= limit) break;
        }
        if (!items.length) throw new Error('itch.io returned no game asset packs');
        return items;
      })()

  - limit: ${{ args.limit }}

columns: [rank, title, author, price, license, commercial_safe, url]
