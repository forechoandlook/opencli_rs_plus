site: unity-assets
name: search
description: 搜索 Unity Asset Store 资源，可按显示价格范围筛选
domain: assetstore.unity.com
strategy: cookie
browser: true
timeoutSeconds: 45

args:
  query:
    type: str
    required: true
    positional: true
    description: "Asset search keywords"
  limit:
    type: int
    default: 20
    description: "Maximum number of results"
  currency:
    type: str
    default: CNY
    description: "ISO 4217 currency code used for displayed prices and price filtering"
  min_price:
    type: str
    default: ""
    description: "Optional inclusive minimum displayed price, for example 0 or 9.99"
  max_price:
    type: str
    default: ""
    description: "Optional inclusive maximum displayed price, for example 20"

pipeline:
  - navigate:
      url: "https://assetstore.unity.com/search#q=${{ args.query | urlencode }}"
      retry: false

  - wait: 4

  - evaluate: |
      (async () => {
        const query = ${{ args.query | json }}.trim();
        const limit = ${{ args.limit | json }};
        const currency = ${{ args.currency | json }}.trim().toUpperCase();
        const minPriceInput = ${{ args.min_price | json }}.trim();
        const maxPriceInput = ${{ args.max_price | json }}.trim();
        if (!query) throw new Error('Search query cannot be empty');
        if (!currency) throw new Error('Currency cannot be empty');
        const parsePrice = (value, name) => {
          if (!value) return null;
          const parsed = Number(value);
          if (!Number.isFinite(parsed) || parsed < 0) throw new Error(`${name} must be a non-negative number`);
          return parsed;
        };
        const minPrice = parsePrice(minPriceInput, 'min_price');
        const maxPrice = parsePrice(maxPriceInput, 'max_price');
        if (minPrice !== null && maxPrice !== null && minPrice > maxPrice) {
          throw new Error('min_price cannot be greater than max_price');
        }

        const cards = Array.from(document.querySelectorAll('[data-test="search-results-list"] [data-test^="search-results-product-card-"]'));
        if (!cards.length) throw new Error(`Unity Asset Store returned no search result cards for: ${query}`);
        const candidateLimit = minPrice === null && maxPrice === null ? limit : 96;
        const ids = cards.map(card => {
          const match = String(card.getAttribute('data-test') || '').match(/search-results-product-card-(\d+)$/);
          return match ? match[1] : '';
        }).filter((id, index, values) => id && values.indexOf(id) === index).slice(0, candidateLimit);
        if (!ids.length) throw new Error(`Unity Asset Store search cards did not contain resource IDs for: ${query}`);
        const assets = await fetch(`/api/assets/get-multiple-assets?ids=${ids.join(',')}&currency=${encodeURIComponent(currency)}`, {
          credentials: 'include',
        }).then(async response => {
          if (!response.ok) throw new Error(`Unity asset detail request failed: HTTP ${response.status}`);
          return response.json();
        });
        const byId = new Map(assets.map(asset => [String(asset.id), asset]));
        const rows = ids.map((id, index) => {
          const asset = byId.get(id);
          if (!asset) return null;
          const price = asset.price || {};
          const rating = asset.rating || {};
          return {
            rank: index + 1,
            id: asset.id,
            name: asset.name || '',
            summary: asset.summary || '',
            category: asset.category?.name || asset.category?.slug || asset.category || '',
            current_price: price.currentPrice || '',
            original_price: price.originalPrice || '',
            discount_percent: price.discountPercent || 0,
            currency: price.currency || currency,
            rating: Number.isFinite(Number(rating.average ?? rating.rating)) ? Number(rating.average ?? rating.rating) : 0,
            ratings: rating.count || rating.counts || 0,
            publisher: asset.publisher?.name || '',
            latest_release_date: asset.latestReleaseDate || '',
            thumbnail: asset.thumbnail || '',
            url: `https://assetstore.unity.com/packages/package/${asset.id}`,
          };
        }).filter(Boolean);
        const inPriceRange = row => {
          const price = Number(String(row.current_price).replace(/[^0-9.-]/g, ''));
          return Number.isFinite(price) &&
            (minPrice === null || price >= minPrice) &&
            (maxPrice === null || price <= maxPrice);
        };
        return (minPrice === null && maxPrice === null ? rows : rows.filter(inPriceRange)).slice(0, limit);
      })()

  - limit: ${{ args.limit }}

columns: [rank, id, name, category, current_price, original_price, discount_percent, currency, rating, ratings, publisher]
