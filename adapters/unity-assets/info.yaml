site: unity-assets
name: info
description: 获取 Unity Asset Store 资源详情
domain: assetstore.unity.com
strategy: cookie
browser: true
timeoutSeconds: 30

args:
  id:
    type: str
    required: true
    positional: true
    description: "Unity Asset Store numeric asset ID"
  currency:
    type: str
    default: CNY
    description: "ISO 4217 currency code used for displayed prices"

pipeline:
  - evaluate: |
      (async () => {
        const id = ${{ args.id | json }};
        const currency = ${{ args.currency | json }};
        const assets = await fetch(`/api/assets/get-multiple-assets?ids=${encodeURIComponent(id)}&currency=${encodeURIComponent(currency)}`, {
          credentials: 'include',
        }).then(async response => {
          if (!response.ok) throw new Error(`Unity asset detail request failed: HTTP ${response.status}`);
          return response.json();
        });
        const asset = assets[0];
        if (!asset) throw new Error(`Unity Asset Store asset not found: ${id}`);
        const price = asset.price || {};
        const rating = asset.rating || {};
        return [{
          id: asset.id,
          name: asset.name || '',
          summary: asset.summary || '',
          description: asset.description || '',
          category: asset.category?.name || asset.category?.slug || asset.category || '',
          tags: asset.tags || [],
          current_price: price.currentPrice || '',
          original_price: price.originalPrice || '',
          discount_percent: price.discountPercent || 0,
          currency: price.currency || currency,
          rating: Number.isFinite(Number(rating.average ?? rating.rating)) ? Number(rating.average ?? rating.rating) : 0,
          ratings: rating.count || rating.counts || 0,
          publisher: asset.publisher?.name || '',
          original_unity_version: asset.originalUnityVersion || '',
          latest_release_date: asset.latestReleaseDate || '',
          thumbnail: asset.thumbnail || '',
          url: `https://assetstore.unity.com/packages/package/${asset.id}`,
        }];
      })()

columns: [id, name, category, current_price, original_price, discount_percent, currency, rating, ratings, publisher, latest_release_date]
