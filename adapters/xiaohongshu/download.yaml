site: xiaohongshu
name: download
description: "下载小红书笔记中的图片和视频"
domain: www.xiaohongshu.com
strategy: cookie
browser: true

args:
  note-id:
    positional: true
    type: string
    required: true
    description: "Note ID or full Xiaohongshu explore URL (preserves xsec_token)"
  output:
    type: string
    default: "./xiaohongshu-downloads"
    description: Output directory

columns: [index, type, status, size]

pipeline:
  - evaluate: |
      (() => {
        const raw = String(${{ args['note-id'] | json }} || '').trim();
        let noteId = raw.replace(/[?#].*$/, '').replace(/\/+$/, '').split('/').pop() || '';
        let xsecToken = '';
        let xsecSource = '';

        try {
          const parsed = new URL(raw);
          if (!/(^|\.)xiaohongshu\.com$/i.test(parsed.hostname)) {
            throw new Error('URL host must be xiaohongshu.com');
          }
          const match = parsed.pathname.match(/^\/explore\/([^/?#]+)$/);
          if (!match) throw new Error('URL must be a Xiaohongshu /explore/<note-id> link');
          noteId = match[1];
          xsecToken = parsed.searchParams.get('xsec_token') || '';
          xsecSource = parsed.searchParams.get('xsec_source') || '';
        } catch (error) {
          if (/^https?:\/\//i.test(raw)) throw error;
        }

        if (!noteId) throw new Error('Missing Xiaohongshu note ID');
        const detailUrl = new URL('https://www.xiaohongshu.com/explore/' + encodeURIComponent(noteId));
        if (xsecToken) {
          detailUrl.searchParams.set('xsec_token', xsecToken);
          detailUrl.searchParams.set('xsec_source', xsecSource || 'pc_feed');
        }
        return { noteId, detailUrl: detailUrl.toString() };
      })()
  - navigate:
      url: ${{ data.detailUrl }}
      retry: false
  - evaluate: |
      (async () => {
        const noteId = ${{ data.noteId | json }};
        if (location.pathname === '/404' || document.title.includes('无法浏览') || document.title.includes('不见了')) {
          throw new Error('该笔记需要从 feed 输出的完整签名链接下载，或已不可浏览；请勿省略 xsec_token');
        }
        const noteMap = window.__INITIAL_STATE__?.note?.noteDetailMap || {};
        const stateEntry = Object.values(noteMap).find(entry => entry?.note)?.note || {};
        const result = {
          noteId: noteId,
          title: stateEntry.title || '',
          author: stateEntry.user?.nickname || '',
          content: stateEntry.desc || '',
          noteType: stateEntry.type || '',
          // Metadata is written locally by the download step. It will redact
          // xsec_token before persisting the source URL.
          sourceUrl: location.href,
          items: []
        };

        // Video notes may not have a separate title. Use the first non-hashtag
        // description line before falling back to a scoped heading; `.title` is
        // intentionally avoided because modal prompts use the same class.
        const descTitle = result.content.split('\n').map(line => line.trim()).find(line => line && !line.startsWith('#')) || '';
        const titleEl = document.querySelector('#detail-title, #noteContainer h1, #noteContainer [data-testid="note-title"]');
        result.title = result.title || descTitle || titleEl?.textContent?.trim() || 'untitled';

        const authorEl = document.querySelector('.username, .author-name, .name');
        result.author = result.author || authorEl?.textContent?.trim() || 'unknown';

        const seen = new Set();
        const addMedia = (type, url, reason = '') => {
          if (!url || seen.has(type + ':' + url)) return;
          seen.add(type + ':' + url);
          result.items.push(reason ? { type, url, reason } : { type, url });
        };

        // The detail state is the canonical image list. Keep its query string:
        // it may select the format/size expected by the website CDN.
        for (const image of Array.isArray(stateEntry.imageList) ? stateEntry.imageList : []) {
          const url = image?.urlDefault || image?.url || image?.urlPre || '';
          if (/^https?:\/\//i.test(url)) addMedia('image', url);
        }

        // DOM is only a fallback when the state was not hydrated. Restrict it to
        // the note media container so recommendation thumbnails are not saved.
        if (result.items.length === 0) {
          document.querySelectorAll('#noteContainer .media-container img, .note-slider img, .swiper-slide img').forEach(img => {
            const src = img.currentSrc || img.src || img.getAttribute('data-src') || '';
            if (/^https?:\/\//i.test(src) && (src.includes('xhscdn') || src.includes('xiaohongshu'))) {
              addMedia('image', src);
            }
          });
        }

        // The player can initially expose a blob: MediaSource URL and then swap
        // to its already-authorized direct MP4 URL. Poll the DOM briefly only;
        // do not click play, synthesize a request, or manufacture a signature.
        const addVideo = url => {
          if (!url) return;
          if (url.startsWith('blob:')) addMedia('video', url, 'browser blob/MSE stream');
          else if (/\.m3u8([?#]|$)/i.test(url)) addMedia('video', url, 'HLS stream');
          else if (/^https?:\/\//i.test(url)) addMedia('video', url);
        };
        const isXhsMp4 = url => {
          try {
            const parsed = new URL(url);
            return /^sns-video(?:-v\d+)?\.xhscdn\.com$/i.test(parsed.hostname)
              && /\.mp4$/i.test(parsed.pathname);
          } catch { return false; }
        };
        // The browser's resource timing list retains the exact signed MP4 URL
        // that this page already requested, even after the player replaces its
        // DOM src with blob:. Restrict it to the XHS video CDN and MP4 paths.
        const observedVideoUrl = performance.getEntriesByType('resource')
          .filter(entry => entry.initiatorType === 'fetch' && isXhsMp4(entry.name))
          .map(entry => entry.name)
          .at(-1) || '';
        if (observedVideoUrl) {
          addVideo(observedVideoUrl);
        } else {
          let fallbackVideoUrl = '';
          for (let attempt = 0; attempt < 6; attempt++) {
            const videos = [...document.querySelectorAll('video')]
              .sort((left, right) => (right.clientWidth * right.clientHeight) - (left.clientWidth * left.clientHeight));
            const directUrl = videos
              .map(video => video.currentSrc || video.src || video.getAttribute('src') || '')
              .find(url => /^https?:\/\//i.test(url) && !/\.m3u8([?#]|$)/i.test(url));
            if (directUrl) {
              addVideo(directUrl);
              fallbackVideoUrl = '';
              break;
            }
            fallbackVideoUrl ||= videos.map(video => video.currentSrc || video.src || video.getAttribute('src') || '')
              .find(url => url.startsWith('blob:') || /\.m3u8([?#]|$)/i.test(url)) || '';
            if (attempt < 5) await new Promise(resolve => setTimeout(resolve, 400));
          }
          if (fallbackVideoUrl) addVideo(fallbackVideoUrl);
        }

        // Text-only notes are still useful: note.md will be created. If both
        // metadata and media are absent, fail loudly instead of a false success.
        if (result.items.length === 0 && !result.content && result.title === 'untitled') {
          throw new Error('未找到笔记内容或媒体：笔记可能已下架、需要登录、或页面结构变化（检查 note-id 与登录状态）');
        }

        result.output = ${{ args.output | default('./xiaohongshu-downloads') | json }};
        result.username = noteId;
        return result;
      })()
  - download:
      type: media-batch
      output: "${{ data.output }}"
      username: "${{ data.username }}"
      referer: "https://www.xiaohongshu.com/"
      saveMetadata: true
      metadataFilename: note.md
