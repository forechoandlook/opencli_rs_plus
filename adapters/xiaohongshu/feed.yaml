site: xiaohongshu
name: feed
description: "小红书首页推荐 Feed (via Pinia Store Action)"
domain: www.xiaohongshu.com
strategy: intercept
browser: true

args:
  limit:
    type: int
    default: 20
    description: Number of items to return

columns: [title, author, likes, type, url]

pipeline:
  - navigate:
      url: https://www.xiaohongshu.com/explore
      waitUntil: commit
      reuseCurrent: true
      retry: false
  - tap:
      store: feed
      action: fetchFeeds
      capture: homefeed
      select: data.items
      framework: pinia
      storeTimeout: 3
      cacheTtl: 60
      timeout: 8
      retry: false
  - evaluate: |
      (() => {
        const items = Array.isArray(${{ data | json }}) ? ${{ data | json }} : [];
        return items.map((item) => {
          const note = item?.noteCard || item?.note_card || {};
          const user = note.user || {};
          const interact = note.interactInfo || note.interact_info || {};
          const id = String(item?.id || item?.noteId || item?.note_id || '').trim();
          const xsecToken = String(item?.xsecToken || item?.xsec_token || '').trim();
          const baseUrl = `https://www.xiaohongshu.com/explore/${encodeURIComponent(id)}`;
          // xsecToken is issued by Xiaohongshu for this feed item. Preserve it
          // verbatim; do not try to synthesize or reuse a token for another note.
          const url = xsecToken
            ? `${baseUrl}?xsec_token=${encodeURIComponent(xsecToken)}&xsec_source=pc_feed`
            : baseUrl;
          return {
            id,
            title: String(note.displayTitle || note.display_title || '').trim(),
            type: String(note.type || '').trim(),
            author: String(user.nickname || '').trim(),
            likes: String(interact.likedCount || interact.liked_count || 0),
            url,
          };
        }).filter((item) => item.id);
      })()
  - limit: ${{ args.limit | default(20) }}
