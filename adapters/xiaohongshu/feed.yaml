site: xiaohongshu
name: feed
description: "小红书首页推荐 Feed (via Pinia Store Action)"
domain: www.xiaohongshu.com
strategy: intercept
browser: true

context:
  title: "保存当前推荐 Feed"
  paths: ["/explore"]
  activeTab:
    extract: |
      (() => {
        const cleanText = value => String(value || '').replace(/\s+/g, ' ').trim();
        const seen = new Set();
        const cards = Array.from(document.querySelectorAll('section.note-item'));
        const roots = cards.length
          ? cards
          : Array.from(document.querySelectorAll('a[href*="/explore/"]'));
        return roots.map(root => {
          const link = root.matches?.('a[href*="/explore/"]')
            ? root
            : root.querySelector('a.cover.mask, a[href*="/explore/"]');
          const url = link?.href || link?.getAttribute?.('href') || '';
          if (!url || seen.has(url)) return null;
          seen.add(url);
          const image = root.querySelector('img');
          const textLines = String(root.innerText || '').split('\n').map(cleanText).filter(Boolean);
          const title = cleanText(root.querySelector('.title, .note-title, a.title, .footer .title span, [class*="title"]')?.textContent || image?.alt || textLines[0] || '');
          const author = cleanText(root.querySelector('a.author .name, .author-name, .nick-name, .author .name, [class*="author"] [class*="name"]')?.textContent || '');
          const likes = cleanText(root.querySelector('.like-count, .like-wrapper .count, .count, [class*="like"] [class*="count"]')?.textContent || '0');
          const type = root.querySelector('video, [class*="video"], [class*="Video"]') ? 'video' : 'image';
          return {
            id: url.match(/\/explore\/([^/?#]+)/)?.[1] || '',
            title,
            author,
            likes,
            type,
            url,
            image: String(image?.currentSrc || image?.src || ''),
          };
        }).filter(Boolean);
      })()

args:
  limit:
    type: int
    default: 20
    description: Number of items to return

columns: [title, author, likes, type, url]

pipeline:
  - navigate:
      url: https://www.xiaohongshu.com/explore
      waitUntil: commit
      reuseCurrent: true
      retry: false
  - tap:
      store: feed
      action: fetchFeeds
      capture: homefeed
      select: data.items
      framework: pinia
      storeTimeout: 3
      cacheTtl: 60
      timeout: 8
      retry: false
  - evaluate: |
      (() => {
        const items = Array.isArray(${{ data | json }}) ? ${{ data | json }} : [];
        return items.map((item) => {
          const note = item?.noteCard || item?.note_card || {};
          const user = note.user || {};
          const interact = note.interactInfo || note.interact_info || {};
          const id = String(item?.id || item?.noteId || item?.note_id || '').trim();
          const xsecToken = String(item?.xsecToken || item?.xsec_token || '').trim();
          const baseUrl = `https://www.xiaohongshu.com/explore/${encodeURIComponent(id)}`;
          // xsecToken is issued by Xiaohongshu for this feed item. Preserve it
          // verbatim; do not try to synthesize or reuse a token for another note.
          const url = xsecToken
            ? `${baseUrl}?xsec_token=${encodeURIComponent(xsecToken)}&xsec_source=pc_feed`
            : baseUrl;
          return {
            id,
            title: String(note.displayTitle || note.display_title || '').trim(),
            type: String(note.type || '').trim(),
            author: String(user.nickname || '').trim(),
            likes: String(interact.likedCount || interact.liked_count || 0),
            url,
          };
        }).filter((item) => item.id);
      })()
  - limit: ${{ args.limit | default(20) }}
