site: xiaohongshu
name: favorites
description: "我的小红书收藏笔记（只读）"
domain: www.xiaohongshu.com
strategy: cookie
browser: true

args:
  limit:
    type: int
    default: 20
    description: "返回笔记数量；仅在未传 --all true 时生效，0 表示不裁剪"
  all:
    type: bool
    default: false
    description: "滚动读取个人收藏页直到没有更多笔记（只读；默认仅首屏）"
  user-id:
    type: string
    required: false
    description: "内部 userId（hex）；省略则读 opencli kv / 主站登录态并缓存到 xiaohongshu:me.userId"

columns: [id, title, author, favorite_time, likes, type, url, download_command]

context:
  title: "导出当前个人收藏"
  paths: ["/user/profile/"]
  activeTab:
    extract: |
      (() => {
        const query = new URL(location.href).searchParams;
        if (query.get('tab') !== 'fav' || query.get('subTab') !== 'note') {
          throw new Error('请先在当前标签打开个人收藏页（?tab=fav&subTab=note）。');
        }
        const userStore = window.__INITIAL_STATE__?.user || {};
        const noteGroups = userStore.notes?._value || userStore.notes || [];
        const groups = Array.isArray(noteGroups) ? noteGroups : [];
        const entries = groups.flatMap((group) => Array.isArray(group) ? group : [group]).filter(Boolean);
        const seen = new Set();
        return entries.map((entry) => {
          const note = entry?.noteCard || entry?.note_card || entry;
          const id = String(note?.noteId || note?.note_id || entry?.noteId || entry?.note_id || entry?.id || '').trim();
          if (!id || seen.has(id)) return null;
          seen.add(id);
          const user = note?.user || {};
          const interact = note?.interactInfo || note?.interact_info || {};
          const token = String(entry?.xsecToken || entry?.xsec_token || note?.xsecToken || note?.xsec_token || '').trim();
          const baseUrl = 'https://www.xiaohongshu.com/explore/' + encodeURIComponent(id);
          return {
            id,
            title: String(note?.displayTitle || note?.display_title || note?.title || '').trim(),
            author: String(user?.nickname || '').trim(),
            likes: String(interact?.likedCount || interact?.liked_count || 0),
            type: String(note?.type || '').trim(),
            url: token ? baseUrl + '?xsec_token=' + encodeURIComponent(token) + '&xsec_source=pc_user' : baseUrl,
          };
        }).filter(Boolean);
      })()

pipeline:
  # 1) CLI arg → seed object
  - evaluate:
      retry: false
      js: |
        (() => {
          const arg = String(args['user-id'] || args.user_id || '').trim();
          const known = /^[a-zA-Z0-9]{12,}$/.test(arg);
          return {
            userId: known ? arg : '',
            source: known ? 'arg' : '',
            redId: '',
            nickname: '',
          };
        })()
  # 2) opencli KV identity cache
  - kv_get:
      key: xiaohongshu:me.userId
      field: userId
      only_if_empty: true
  - kv_get:
      key: xiaohongshu:me.redId
      field: redId
      only_if_empty: true
  - kv_get:
      key: xiaohongshu:me.nickname
      field: nickname
      only_if_empty: true
  # 3) Choose URL: known userId → fav tab; else explore to read userInfo
  - evaluate:
      retry: false
      js: |
        (() => {
          const userId = String(data.userId || '').trim();
          const known = /^[a-zA-Z0-9]{12,}$/.test(userId);
          return {
            userId: known ? userId : '',
            source: known ? (data.source || 'kv') : '',
            redId: String(data.redId || ''),
            nickname: String(data.nickname || ''),
            resolveUrl: known
              ? ('https://www.xiaohongshu.com/user/profile/' + encodeURIComponent(userId) + '?tab=fav&subTab=note')
              : 'https://www.xiaohongshu.com/explore',
          };
        })()
  - navigate:
      url: ${{ data.resolveUrl }}
      settleMs: 2000
      reuseCurrent: true
      retry: false
  # 4) Authoritative me from main-site userInfo; detect account switch
  - evaluate:
      retry: false
      js: |
        (() => {
          const unwrap = (v) => (v && v.__v_isRef) ? v._value : v;
          const info = unwrap(window.__INITIAL_STATE__?.user?.userInfo) || {};
          const pageId = String(info.userId || info.user_id || '').trim();
          const redId = String(info.redId || info.red_id || '').trim();
          const nickname = String(info.nickname || '').trim();
          let userId = String(data.userId || '').trim();
          let source = String(data.source || '');
          let persist = false;

          if (/^[a-zA-Z0-9]{12,}$/.test(pageId)) {
            if (!/^[a-zA-Z0-9]{12,}$/.test(userId) || userId !== pageId) {
              userId = pageId;
              source = 'page';
              persist = true;
            }
          }

          if (!/^[a-zA-Z0-9]{12,}$/.test(userId)) {
            throw new Error('无法从主站登录态解析内部 userId。请先在 Chrome 登录 www.xiaohongshu.com。');
          }

          const pathId = (location.pathname.match(/\/user\/profile\/([a-zA-Z0-9]+)/) || [])[1] || '';
          const q = new URL(location.href).searchParams;
          const onFav = pathId === userId && q.get('tab') === 'fav' && q.get('subTab') === 'note';

          return {
            userId,
            redId: redId || String(data.redId || ''),
            nickname: nickname || String(data.nickname || ''),
            source,
            persist,
            onFav,
            favUrl: 'https://www.xiaohongshu.com/user/profile/' + encodeURIComponent(userId) + '?tab=fav&subTab=note',
          };
        })()
  # 5) Cache identity (skip empty)
  - kv_set:
      key: xiaohongshu:me.userId
      value: ${{ data.userId }}
  - kv_set:
      key: xiaohongshu:me.redId
      value: ${{ data.redId }}
  - kv_set:
      key: xiaohongshu:me.nickname
      value: ${{ data.nickname }}
  # 6) Ensure fav tab (reuseCurrent skips work if already there)
  - navigate:
      url: ${{ data.favUrl }}
      settleMs: 2000
      reuseCurrent: true
      retry: false
  - evaluate:
      retry: false
      js: |
        (async () => {
          const query = new URL(location.href).searchParams;
          if (query.get('tab') !== 'fav' || query.get('subTab') !== 'note') {
            throw new Error('未能打开个人收藏页（?tab=fav&subTab=note）。');
          }
          const wantAll = Boolean(args.all);
          const seen = new Set();
          const rows = [];
          const toIso = (value) => {
            const n = Number(value || 0);
            if (!Number.isFinite(n) || n <= 0) return '';
            return new Date(n < 100000000000 ? n * 1000 : n).toISOString();
          };
          const collect = () => {
            const userStore = window.__INITIAL_STATE__?.user || {};
            const noteGroups = userStore.notes?._value || userStore.notes || [];
            const groups = Array.isArray(noteGroups) ? noteGroups : [];
            const entries = groups.flatMap((group) => Array.isArray(group) ? group : [group]).filter(Boolean);
            for (const entry of entries) {
              const note = entry?.noteCard || entry?.note_card || entry;
              const id = String(note?.noteId || note?.note_id || entry?.noteId || entry?.note_id || entry?.id || '').trim();
              if (!id || seen.has(id)) continue;
              seen.add(id);
              const user = note?.user || {};
              const interact = note?.interactInfo || note?.interact_info || {};
              const token = String(entry?.xsecToken || entry?.xsec_token || note?.xsecToken || note?.xsec_token || '').trim();
              const baseUrl = 'https://www.xiaohongshu.com/explore/' + encodeURIComponent(id);
              const url = token ? baseUrl + '?xsec_token=' + encodeURIComponent(token) + '&xsec_source=pc_user' : baseUrl;
              // Only report an actual collection timestamp. A note's published time is not a substitute.
              const favoriteTime = entry?.collectTime || entry?.collect_time || entry?.favoriteTime || entry?.favorite_time || entry?.favTime || entry?.fav_time || '';
              rows.push({
                id,
                title: String(note?.displayTitle || note?.display_title || note?.title || '').trim(),
                author: String(user?.nickname || '').trim(),
                favorite_time: toIso(favoriteTime),
                likes: String(interact?.likedCount || interact?.liked_count || 0),
                type: String(note?.type || '').trim(),
                url,
                download_command: 'opencli xiaohongshu download ' + JSON.stringify(url),
              });
            }
          };
          collect();
          if (wantAll) {
            let stableRounds = 0;
            let rounds = 0;
            // Let the site's own lazy loader provide further cards; no private API or fabricated signature is used.
            while (stableRounds < 4) {
              if (rounds++ >= 500) {
                throw new Error('个人收藏页在 500 次滚动后仍持续加载；为避免静默截断，请稍后重试。');
              }
              const before = rows.length;
              const height = Math.max(document.body.scrollHeight, document.documentElement.scrollHeight);
              window.scrollTo({ top: height, behavior: 'auto' });
              // The page writes new cards asynchronously after its intersection observer fires.
              // Poll the state rather than assuming a fixed network delay, otherwise a run can
              // return the initial 20/30 cards while the next page arrives moments later.
              const changed = await new Promise(resolve => {
                const deadline = Date.now() + 5000;
                const poll = () => {
                  collect();
                  if (rows.length > before) return resolve(true);
                  if (Date.now() >= deadline) return resolve(false);
                  setTimeout(poll, 200);
                };
                setTimeout(poll, 200);
              });
              stableRounds = changed ? 0 : stableRounds + 1;
            }
            window.scrollTo({ top: 0, behavior: 'auto' });
          }
          if (!rows.length) throw new Error('个人收藏页未自然加载笔记，或收藏为空。');
          const limit = Math.max(Number(args.limit || 20), 0);
          // --all intentionally has no numeric cap: it must not silently stop before 200 items.
          return wantAll || limit === 0 ? rows : rows.slice(0, limit);
        })()
