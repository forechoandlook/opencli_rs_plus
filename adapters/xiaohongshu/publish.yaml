site: xiaohongshu
name: publish
description: "发布小红书图文笔记；仅在 --confirm true 时上传、填写并保存草稿或发布"
domain: creator.xiaohongshu.com
strategy: cookie
browser: true
timeoutSeconds: 120

args:
  title:
    type: string
    required: true
    description: "笔记标题（最多 20 字）"
  content:
    positional: true
    type: string
    required: true
    description: "笔记正文"
  images:
    type: string
    required: true
    description: "图片绝对路径，逗号分隔（jpg/jpeg/png/webp）"
  topics:
    type: string
    description: "可选话题，逗号分隔；作为 #话题 写入正文"
  draft:
    type: bool
    default: true
    description: "默认 true，保存草稿；传 false 才尝试公开发布"
  confirm:
    type: bool
    required: true
    description: "必须显式传 --confirm true 才会上传文件或写入页面"

columns: [status, detail, page_url]

pipeline:
  - navigate:
      url: https://creator.xiaohongshu.com/publish/publish?from=menu_left
      retry: false
  - wait:
      selector: '.creator-tab'
  # The current creator page opens the video tab first. Check confirmation
  # before switching to image mode, then choose the visible image tab.
  - evaluate:
      retry: false
      js: |
        (() => {
          if (args.confirm !== true) {
            throw new Error('上传、存草稿或发布都需要显式传 --confirm true；当前没有修改页面或上传文件');
          }
          const title = String(args.title || '').trim();
          const content = String(args.content || '').trim();
          const images = String(args.images || '').split(',').map(value => value.trim()).filter(Boolean);
          if (!title) throw new Error('title 不能为空');
          if (title.length > 20) throw new Error(`title 长度为 ${title.length}，不能超过 20`);
          if (!content) throw new Error('content 不能为空');
          if (!images.length || images.length > 18) throw new Error('images 需要 1 至 18 个绝对路径，以英文逗号分隔');
          const imageTab = [...document.querySelectorAll('.creator-tab')].find(item =>
            item.offsetParent !== null && (item.textContent || '').trim() === '上传图文'
          );
          if (!(imageTab instanceof HTMLElement)) throw new Error('未找到小红书“上传图文”入口；页面可能已改版或登录已过期');
          imageTab.click();
          return { validated: true, imageCount: images.length, draft: args.draft !== false };
        })()
  - wait:
      selector: 'input.upload-input[type="file"][accept*=".jpg"]'
  - upload:
      selector: 'input.upload-input[type="file"][accept*=".jpg"]'
      paths: '${{ args.images }}'
      retry: false
  # Wait once for the site to render the title/editor form. Do not retry the
  # upload or call unpublished creator APIs.
  - wait:
      time: 2
  - evaluate:
      retry: false
      js: |
        (() => {
          const setInputValue = (input, value) => {
            const setter = Object.getOwnPropertyDescriptor(HTMLInputElement.prototype, 'value')?.set;
            if (!setter) throw new Error('浏览器不支持标题输入');
            setter.call(input, value);
            input.dispatchEvent(new InputEvent('input', { bubbles: true, inputType: 'insertText', data: value }));
            input.dispatchEvent(new Event('change', { bubbles: true }));
          };
          const title = String(args.title || '').trim();
          const rawContent = String(args.content || '').trim();
          const topics = String(args.topics || '').split(',')
            .map(value => value.trim().replace(/^#/, ''))
            .filter(Boolean)
            .map(value => `#${value}`);
          const content = [rawContent, ...topics].filter(Boolean).join('\n');
          const titleInput = [...document.querySelectorAll('input')].find(input =>
            input.offsetParent !== null && (input.maxLength === 20 || input.placeholder?.includes('标题'))
          );
          if (!(titleInput instanceof HTMLInputElement)) throw new Error('图片上传后未找到小红书标题输入框；未提交');
          setInputValue(titleInput, title);

          const editor = [...document.querySelectorAll('[contenteditable="true"], textarea')].find(element =>
            element.offsetParent !== null && !element.matches('input')
          );
          if (!(editor instanceof HTMLElement)) throw new Error('图片上传后未找到小红书正文编辑器；未提交');
          editor.focus();
          if (editor instanceof HTMLTextAreaElement) {
            const setter = Object.getOwnPropertyDescriptor(HTMLTextAreaElement.prototype, 'value')?.set;
            if (!setter) throw new Error('浏览器不支持正文输入');
            setter.call(editor, content);
          } else {
            editor.textContent = content;
          }
          editor.dispatchEvent(new InputEvent('input', { bubbles: true, inputType: 'insertText', data: content }));
          editor.dispatchEvent(new Event('change', { bubbles: true }));
          return { ready: true, topicCount: topics.length };
        })()
  - evaluate:
      retry: false
      js: |
        (async () => {
          const isDraft = args.draft !== false;
          const labels = isDraft ? ['保存草稿', '存草稿'] : ['发布', '发布笔记'];
          const button = [...document.querySelectorAll('button, [role="button"]')].find(item => {
            const label = (item.textContent || '').replace(/\s+/g, '').trim();
            return item.offsetParent !== null && !item.hasAttribute('disabled') && labels.some(expected => label === expected || label.includes(expected));
          });
          if (!(button instanceof HTMLElement)) {
            throw new Error(`未找到小红书${isDraft ? '保存草稿' : '发布'}按钮；未提交`);
          }
          const before = location.href;
          button.click();
          await new Promise(resolve => setTimeout(resolve, 2500));
          const errors = [...document.querySelectorAll('[class*="error"], [class*="Error"]')]
            .filter(item => item.offsetParent !== null)
            .map(item => (item.textContent || '').replace(/\s+/g, ' ').trim())
            .filter(Boolean)
            .slice(0, 3);
          return [{
            status: errors.length ? '未提交：请补全小红书表单' : (isDraft ? '已点击保存草稿，请在创作中心确认' : '已点击发布，请在创作中心确认'),
            detail: errors.length ? errors.join('；') : '平台可能仍在审核、跳转或要求补充内容',
            page_url: location.href || before,
          }];
        })()
  - map:
      status: '${{ item.status }}'
      detail: '${{ item.detail }}'
      page_url: '${{ item.page_url }}'
