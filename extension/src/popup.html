<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OpenCLI</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 13px;
      width: 420px;
      padding: 14px 16px;
      background: #1e1e2e;
      color: #cdd6f4;
    }
    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
      gap: 8px;
    }
    .label {
      color: #6c7086;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    input[type="number"] {
      background: #313244;
      border: 1px solid #45475a;
      border-radius: 4px;
      color: #89b4fa;
      font-family: 'SF Mono', 'Cascadia Code', Consolas, monospace;
      font-size: 14px;
      padding: 3px 8px;
      width: 90px;
      text-align: center;
    }
    input[type="number"]:focus {
      outline: none;
      border-color: #89b4fa;
    }
    #status {
      font-size: 11px;
      transition: color 0.3s;
    }
    button {
      font-size: 11px;
      padding: 3px 8px;
      border: 1px solid #313244;
      border-radius: 4px;
      background: #313244;
      color: #cdd6f4;
      cursor: pointer;
      transition: background 0.15s;
    }
    button:hover { background: #45475a; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    hr {
      border: none;
      border-top: 1px solid #313244;
      margin: 10px 0;
    }
    .hint {
      font-size: 10px;
      color: #6c7086;
      margin-top: 4px;
    }
    .section-title {
      color: #bac2de;
      font-size: 12px;
      font-weight: 600;
    }
    #context-actions, #tasks, #page-cache { max-height: 240px; overflow-y: auto; }
    .empty { color: #6c7086; font-size: 11px; padding: 8px 0; }
    .task { border: 1px solid #313244; border-radius: 6px; padding: 8px; margin-top: 7px; }
    .task-title { color: #cdd6f4; font-family: 'SF Mono', 'Cascadia Code', Consolas, monospace; font-size: 12px; }
    .task-meta { align-items: center; color: #6c7086; display: flex; font-size: 10px; gap: 7px; justify-content: space-between; margin-top: 5px; }
    .badge { border-radius: 99px; font-size: 10px; padding: 2px 6px; }
    .badge.running { background: #45475a; color: #cdd6f4; }
    .badge.done { background: #1f4d3b; color: #a6e3a1; }
    .badge.failed { background: #5b2b39; color: #f38ba8; }
    pre { border-top: 1px solid #313244; color: #a6adc8; font-family: 'SF Mono', 'Cascadia Code', Consolas, monospace; font-size: 10px; line-height: 1.35; margin-top: 7px; max-height: 105px; overflow: auto; padding-top: 7px; white-space: pre-wrap; word-break: break-word; }
    .cache-summary { color: #6c7086; font-size: 10px; padding: 4px 0; }
    .cache-page { border: 1px solid #313244; border-radius: 6px; margin-top: 6px; padding: 7px; }
    .cache-url { color: #6c7086; font-family: 'SF Mono', 'Cascadia Code', Consolas, monospace; font-size: 10px; margin-top: 4px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .context-page { color: #6c7086; font-family: 'SF Mono', 'Cascadia Code', Consolas, monospace; font-size: 10px; padding: 4px 0; }
    .context-action { align-items: center; border: 1px solid #313244; border-radius: 6px; display: flex; gap: 8px; justify-content: space-between; margin-top: 6px; padding: 8px; }
    .context-description { color: #a6adc8; font-size: 10px; line-height: 1.35; margin-top: 4px; }
  </style>
</head>
<body>
  <div class="row">
    <span class="label">Daemon Port</span>
    <input type="number" id="port-input" value="19825" min="1" max="65535" />
  </div>
  <div class="row">
    <span id="status" style="color:#888">Checking…</span>
    <button id="save-btn">Save</button>
  </div>
  <hr>
  <div class="row">
    <span class="section-title">当前页面操作</span>
    <span class="hint">由 daemon 注册</span>
  </div>
  <div id="context-actions"><p class="empty">正在读取当前页面操作…</p></div>
  <hr>
  <div class="row">
    <span class="section-title">浏览器任务</span>
    <button id="refresh-btn">刷新</button>
  </div>
  <div id="tasks"><p class="empty">正在读取任务…</p></div>
  <hr>
  <div class="row">
    <span class="section-title">页面缓存</span>
    <span class="hint">LRU · 最多 10 页</span>
  </div>
  <div id="page-cache"><p class="empty">正在读取缓存…</p></div>
  <hr>
  <p class="hint">Set port to match OPENCLI_DAEMON_PORT env.</p>
  <script type="module" src="../dist/popup.js"></script>
</body>
</html>
